{% comment %}
Partial for one index-table count cell: a single total that links to the
filtered poses view. Expects `count`, `tax_id`, `qkey` and `qval` from the
includer. A zero renders dimmed with no link.
{% endcomment %}{% if count %}<a class="part" href="{% url 'moths:pose_view' tax_id %}?{{ qkey }}={{ qval|urlencode }}" title="{{ qval }}">{{ count }}</a>{% else %}<span class="zero">0</span>{% endif %}
