{% if cell.total %}<span class="triple"><a class="part{% if not cell.train %} zero{% endif %}" href="{% url 'moths:tax_detail' tax_id %}?{{ qkey }}={{ qval|urlencode }}&amp;subset=train" title="{{ qval }} · train">{{ cell.train }}</a>+<a class="part{% if not cell.val %} zero{% endif %}" href="{% url 'moths:tax_detail' tax_id %}?{{ qkey }}={{ qval|urlencode }}&amp;subset=val" title="{{ qval }} · val">{{ cell.val }}</a>+<a class="part{% if not cell.none %} zero{% endif %}" href="{% url 'moths:tax_detail' tax_id %}?{{ qkey }}={{ qval|urlencode }}&amp;subset=none" title="{{ qval }} · unlisted">{{ cell.none }}</a></span>{% else %}<span class="zero">0</span>{% endif %}
