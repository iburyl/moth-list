{% extends "moths/base.html" %}

{% block title %}Log in — Moth List{% endblock %}

{% block content %}
    <h2 class="tax-heading">Log in</h2>

    {% if form.errors %}
        <p class="muted" style="color: #dc2626;">
            That username and password didn't match. Please try again.
        </p>
    {% endif %}

    <form method="post" style="max-width: 20rem; display: flex; flex-direction: column; gap: 0.75rem;">
        {% csrf_token %}
        <label>Username<br>
            <input type="text" name="username" autocomplete="username" autofocus required
                   style="width: 100%; padding: 0.4rem 0.6rem;">
        </label>
        <label>Password<br>
            <input type="password" name="password" autocomplete="current-password" required
                   style="width: 100%; padding: 0.4rem 0.6rem;">
        </label>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="header-btn" style="align-self: flex-start;">Log in</button>
    </form>
{% endblock %}
